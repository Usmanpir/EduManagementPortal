name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eduattend
          POSTGRES_PASSWORD: eduattend
          POSTGRES_DB: eduattend_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eduattend -d eduattend_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # CI-only values; no real secrets are needed to build or test.
      DATABASE_URL: postgresql://eduattend:eduattend@localhost:5432/eduattend_test?schema=public
      TEST_DATABASE_URL: postgresql://eduattend:eduattend@localhost:5432/eduattend_test?schema=public
      AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx next typegen && npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit & integration tests (incl. the API security sweep)
        run: npm run test:all
      - name: Production build
        run: npm run build
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: false
          cache-from: type=gha
