services:
  postgres:
    image: postgres:17-alpine
    container_name: eduattend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduattend
      POSTGRES_PASSWORD: eduattend
      POSTGRES_DB: eduattend
    ports:
      - "5432:5432"
    volumes:
      - eduattend-pg:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduattend -d eduattend"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eduattend-pg:
